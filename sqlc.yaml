version: "2"
sql:
  - engine: "sqlite"
    schema: "./internal/db/migrations"
    queries: "./internal/db/queries"
    gen:
      go:
        package: "repo"
        out: "./internal/db/sqlc"
        emit_interface: true 
        overrides:
        - column: "messages.role"
          go_type: "github.com/biisal/bai/internal/domain.Role"