version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - lll
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - lll
      # unsplittable string literals / prompt text
      - linters:
          - lll
        source: '^\s*("|You are an expert)'
    paths:
      - ^web/

formatters:
  enable:
    - gofmt
    - golines
  settings:
    golines:
      max-len: 120
      tab-len: 4
      reformat-tags: false
